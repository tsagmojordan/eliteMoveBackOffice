spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

mqtt:
  broker:
    url: ${MQTT_BROKER_URL}
    username: ${MQTT_BROKER_USERNAME}
    password: ${MQTT_BROKER_PASSWORD}
  client:
    id: ${MQTT_CLIENT_ID}
