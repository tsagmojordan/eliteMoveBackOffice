# .github/workflows/deploy.yml
name: Build & Deploy sur Back4app

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ex: tonuser/mon-backend

jobs:
  build-and-push:
    name: 🔨 Build + Push image Docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # pour pousser sur GHCR

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔐 Login sur GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: 🏗️ Build et push de l'image GraalVM
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache pour accélérer les builds suivants
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy sur Back4app
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📡 Déclencher le redéploiement Back4app
        run: |
          curl -X POST \
            -H "X-Back4App-Application-Id: ${{ secrets.BACK4APP_APP_ID }}" \
            -H "X-Back4App-REST-API-Key: ${{ secrets.BACK4APP_REST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "ghcr.io/${{ github.repository }}:latest"
            }' \
            https://containers.back4app.com/redeploy
